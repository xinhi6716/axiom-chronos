[package]
name = "axiom-chronos"
version = "2.0.1"
edition = "2021"
default-run = "axiom"

[lib]
name = "axiom"
path = "src/lib.rs"

[[bin]]
name = "axiom"
path = "src/main.rs"

[[bin]]
name = "chronos"
path = "src/bin/chronos.rs"
required-features = ["app"]

[features]
app = ["dep:gpui-kit", "dep:embed-resource"]

[dependencies]
ttf-parser = "0.25"  # p8
libloading = "0.8"
gpui-kit = { version = "=0.9.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
regex = "1"
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "visit", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
flate2 = "=1.1.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Time", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_Security_Authorization", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[build-dependencies]
embed-resource = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
