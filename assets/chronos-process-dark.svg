<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc"><title id="title">Axiom Chronos 1.0 workflow</title><desc id="desc">Astra plans, the critic reviews the plan, the architect splits modules, Codex builds, Claude reviews the code, and full tests, CI and memory close the loop.</desc><rect x="0" y="0" width="1200" height="190" fill="#101a22" /><path d="M100 53H1100" stroke="#566675" stroke-width="3" stroke-linecap="round" /><circle cx="100" cy="53" r="15" fill="#d7bd82" /><circle cx="100" cy="53" r="5" fill="#101a22" /><text x="100" y="101" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4efe3">Astra</text><text x="100" y="129" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#a9b4bf">plans first</text><circle cx="300" cy="53" r="15" fill="#d7bd82" /><circle cx="300" cy="53" r="5" fill="#101a22" /><text x="300" y="101" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4efe3">Critic</text><text x="300" y="129" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#a9b4bf">second review</text><circle cx="500" cy="53" r="15" fill="#d7bd82" /><circle cx="500" cy="53" r="5" fill="#101a22" /><text x="500" y="101" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4efe3">Architect</text><text x="500" y="129" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#a9b4bf">splits modules</text><circle cx="700" cy="53" r="15" fill="#d7bd82" /><circle cx="700" cy="53" r="5" fill="#101a22" /><text x="700" y="101" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#f4efe3">Codex</text><text x=