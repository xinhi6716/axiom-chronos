[package]
name = "desktop-smoke"
version = "0.0.0"
edition = "2021"
publish = false

# Not part of the root workspace: keeps the root Cargo.lock free of gpui-kit's test-support packages.
[workspace]

[dependencies]
axiom-chronos = { path = "../..", features = ["app"] }
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
