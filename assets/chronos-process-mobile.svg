<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc"><title id="title">Axiom Chronos 1.0 workflow</title><desc id="desc">Astra plans, the critic reviews the plan, the architect splits modules, Codex builds, Claude reviews the code, and full tests, CI and memory close the loop.</desc><rect x="0" y="0" width="600" height="340" fill="#f4efe3" /><path d="M100 45H500" stroke="#9d9788" stroke-width="3" stroke-linecap="round" /><path d="M500 45C580 45 580 205 500 205" fill="none" stroke="#9d9788" stroke-width="3" stroke-linecap="round" /><path d="M500 205H100" stroke="#9d9788" stroke-width="3" stroke-linecap="round" /><circle cx="100" cy="45" r="15" fill="#8d6b2d" /><circle cx="100" cy="45" r="5" fill="#f4efe3" /><text x="100" y="93" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#101a22">Astra</text><text x="100" y="121" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#5b5548">plans first</text><circle cx="300" cy="45" r="15" fill="#8d6b2d" /><circle cx="300" cy="45" r="5" fill="#f4efe3" /><text x="300" y="93" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#101a22">Critic</text><text x="300" y="121" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#5b5548">second review</text><circle cx="500" cy="45" r="15" fill="#8d6b2d" /><circle cx="500" cy="45" r="5" fill="#f4efe3" /><text x="500" y="93" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#101a22">Architect</text><text x="500" y="121" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#5b5548">splits modules</text><circle cx="500" cy="205" r="15" fill="#8d6b2d" /><circle cx="500" cy="205" r="5" fill="#f4efe3" /><text x="500" y="253" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#101a22">Codex</text><text x="500" y="281" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#5b5548">terra builds</text><circle cx="300" cy="205" r="15" fill="#8d6b2d" /><circle cx="300" cy="205" r="5" fill="#f4efe3" /><text x="300" y="253" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#101a22">Claude review</text><text x="300" y="281" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#5b5548">cross-family check</text><circle cx="100" cy="205" r="15" fill="#8d6b2d" /><circle cx="100" cy="205" r="5" fill="#f4efe3" /><text x="100" y="253" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#101a22">Verify</text><text x="100" y="281" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#5b5548">full test, CI, memory</text></svg>
