[package]
name = "desktop-smoke"
version = "0.0.0"
edition = "2021"
publish = false

# Not part of the root workspace: keeps the root Cargo.lock free of gpui-kit's test-support packages.
[workspace]

[dependencies]
axiom-chronos = { path = "../..", features = ["app"] }
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
png = "0.17"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
