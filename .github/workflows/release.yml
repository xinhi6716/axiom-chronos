name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: axiom-x86_64-pc-windows-msvc.exe
            bin: target/release/axiom.exe
          - os: ubuntu-latest
            asset: axiom-x86_64-unknown-linux-gnu
            bin: target/release/axiom
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: cp ${{ matrix.bin }} ${{ matrix.asset }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum * > SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG#v}.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          gh release create "$TAG" dist/* --verify-tag --title "Axiom Chronos ${TAG#v}" --notes-file "$notes"
